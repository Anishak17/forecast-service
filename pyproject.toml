[project]
name = "forecast-service"
version = "0.1.0"
description = "Time-series forecasting API with backtesting, drift checks and scheduled retraining. Runs in Docker, Kubernetes, AWS and GCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.2", "fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forecast*"]
