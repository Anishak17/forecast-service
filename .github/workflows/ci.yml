name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forecast-service:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8080 --name api forecast-service:ci
          for i in $(seq 1 20); do curl -sf localhost:8080/ready && break; sleep 1; done
          curl -sf "localhost:8080/forecast?horizon=7"
