# Retrain every night at 02:00. The API notices the new file and reloads it without a restart.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forecast-retrain
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: models
              persistentVolumeClaim: {claimName: forecast-models}
          containers:
            - name: train
              image: forecast-service:local
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "forecast.train", "/tmp/alarms.csv", "/models/model.json"]
              volumeMounts: [{name: models, mountPath: /models}]
              securityContext: {runAsUser: 10001}
