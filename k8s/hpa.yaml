# Scale between 2 and 5 pods on CPU. Needs metrics-server (see README).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forecast-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: forecast-service}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
